[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-guardrails"
version = "3.2.0"
description = "Governance framework that makes AI coding agents trustworthy"

readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Aegis Contributors"}
]
keywords = [
    "ai-governance", "agent-alignment", "evolutionary-rules",
    "code-review", "ai-coding-assistant", "token-optimization"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
aegis = "aegis_cli.cli:main"
aegis-mcp = "aegis_mcp.server:main"

[project.optional-dependencies]
ai = ["google-genai>=1.0"]
gemini = ["google-genai>=1.0"]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.0"]
keyring = ["keyring>=23.0.0"]
dev = ["pytest", "pytest-xdist>=3.5.0", "ruff", "hypothesis>=6.100.0", "coverage", "pyyaml", "anyio"]

[project.urls]
Homepage = "https://github.com/nseney1/Aegis-Guardrails"
Documentation = "https://github.com/nseney1/Aegis-Guardrails/tree/main/docs"
Changelog = "https://github.com/nseney1/Aegis-Guardrails/blob/main/docs/project/CHANGELOG.md"



[tool.setuptools.packages.find]
include = [
    "aegis_cli*", "aegis_sdk*", "aegis_core*", "aegis_mcp*",
    "rules*", "skills*"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
aegis_sdk = ["py.typed"]
aegis_cli = ["starter_rules/*.md"]
aegis_core = ["ast/drivers/templates/*"]
rules = ["*.md", ".oracles/*.md"]
skills = ["*/SKILL.md"]


[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
# pytest < 9 silently skips an async test when no async plugin is installed;
# make that an error so a missing plugin can't hide tests on CI again.
# Matched by message: pytest 9 removed the warning class (it fails instead).
filterwarnings = ["error:async def functions are not natively supported"]
