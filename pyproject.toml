[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-guardrails"
dynamic = ["version"]
description = "Rules and an MCP server that keep AI coding agents (Claude Code, Codex CLI, Gemini CLI, Antigravity) on track"

readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Aegis Contributors"}
]
keywords = [
    "ai-coding-agents", "guardrails", "mcp", "agents-md", "claude-code",
    "codex", "gemini-cli", "antigravity", "code-review"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
aegis = "aegis_cli.cli:main"
aegis-mcp = "aegis_mcp.server:main"

[project.optional-dependencies]
# Layer 2 runs any model through --llm-cmd / AEGIS_LLM_CMD, so there are no
# vendor SDK extras. Runtime dependencies stay empty.
dev = ["pytest", "pytest-xdist>=3.5.0", "ruff", "hypothesis>=6.100.0", "coverage", "pyyaml", "anyio", "build"]

[project.urls]
Homepage = "https://github.com/nseney1/Aegis-Guardrails"
Documentation = "https://github.com/nseney1/Aegis-Guardrails/blob/main/docs/how-it-works.md"
Changelog = "https://github.com/nseney1/Aegis-Guardrails/blob/main/CHANGELOG.md"



[tool.setuptools.packages.find]
include = [
    "aegis_cli*", "aegis_sdk*", "aegis_core*", "aegis_mcp*",
    "rules*", "skills*"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
# The one version source (D18). setuptools reads the assignment without importing aegis_core.
version = {attr = "aegis_core._version.__version__"}

[tool.setuptools.package-data]
aegis_sdk = ["py.typed"]
aegis_core = ["ast/drivers/templates/*"]
rules = ["*.md", ".oracles/*.md"]
skills = ["*/SKILL.md"]


[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
# pytest < 9 silently skips an async test when no async plugin is installed;
# make that an error so a missing plugin can't hide tests on CI again.
# Matched by message: pytest 9 removed the warning class (it fails instead).
filterwarnings = ["error:async def functions are not natively supported"]
