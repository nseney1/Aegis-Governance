name: Validate

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']
  workflow_call:
  workflow_dispatch:

# Least privilege: every job gets a read-only token unless it grants more below.
permissions:
  contents: read

jobs:
  # Audits the resolved runtime dependencies declared in pyproject.toml.
  # pip-audit is a CI-only tool; it is not a project dependency.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit project dependencies
        run: pip-audit --strict .

  build-wheel:
    needs: dependency-audit
    runs-on: ubuntu-latest
    # id-token + attestations are only for the provenance attestation step.
    # When called from publish.yml, the caller job must grant these too.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install build==1.6.1
      - name: Build wheel and sdist (the only build of this release)
        run: python -m build
      - name: Record artifact digests
        run: python .github/scripts/verify_dist.py record dist
      # The sdist is published too, so it is installed and smoke-tested here
      # rather than shipped untested.
      - name: Smoke-test sdist (source hidden)
        run: |
          SMOKE="$PWD/.github/scripts/wheel_smoke.py"
          SDIST="$(ls "$PWD"/dist/*.tar.gz)"
          VENV="$RUNNER_TEMP/sdist-venv"
          python -m venv "$VENV"
          "$VENV/bin/pip" install "$SDIST"
          cd "$RUNNER_TEMP" && env -u PYTHONPATH "$VENV/bin/python" -I "$SMOKE"
      # Signed SLSA build provenance for the exact bytes recorded in SHA256SUMS.
      # Skipped on pull_request: fork PRs never receive an OIDC token.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soma-wheel
          path: dist/

  validate:
    needs: [build-wheel, dependency-audit]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soma-wheel
          path: dist/
      
      - name: Verify artifact digests
        run: python .github/scripts/verify_dist.py verify dist

      - name: Install test dependencies
        run: |
          pip install pytest==8.3.4 pytest-xdist==3.6.1 ruff==0.9.10 hypothesis==6.126.0 coverage==7.6.12 pyyaml==6.0.2 anyio==4.12.1
          pip install dist/*.whl

      # The unit suite below runs from the checkout (pythonpath = ["."]), so on
      # its own it cannot prove the wheel works. This step runs the installed
      # wheel from outside the repo, in isolated mode, and asserts every Soma
      # module resolves from site-packages.
      - name: Smoke-test installed wheel (source hidden)
        shell: bash
        run: |
          SMOKE="$PWD/.github/scripts/wheel_smoke.py"
          cd "$RUNNER_TEMP" && env -u PYTHONPATH python -I "$SMOKE"

      - name: Run validation
        run: make validate

      - name: Run Layer 1 Deterministic Verification
        run: python3 -m soma_cli.verify --layer1-only

      - name: Verify Release Gate 4.5 (PRs targeting main)
        if: github.base_ref == 'main'
        run: python3 -m soma_cli.verify --release-gate
      
      - name: Run test suite
        id: test
        run: make test

      - name: Soma CI Outcome Report
        if: always()
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            CHANGED=$(git diff --name-only "origin/$PR_BASE_SHA...HEAD" 2>/dev/null || git diff --name-only "$PR_BASE_SHA...HEAD" 2>/dev/null || echo "")
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi
          if [ -n "$CHANGED" ]; then
            python3 -c "import sys; from soma_core.enforcement import cli_ci_outcome_reporter; sys.exit(cli_ci_outcome_reporter(sys.argv[1:]))" \
              --changed-files "$CHANGED" \
              --test-result "${TEST_OUTCOME:-skipped}" \
              --commit-sha "$COMMIT_SHA" \
              --format markdown >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verify README claims
        run: python3 -c "import sys; from soma_core.enforcement import cli_verify_readme_claims; sys.exit(cli_verify_readme_claims())"

      - name: Verify Bug Registry
        run: python3 -c "import sys; from soma_core.enforcement import cli_verify_bug_registry; sys.exit(cli_verify_bug_registry())"

      - name: Check for hardcoded paths
        run: |
          # Exclude template examples like /home/<user>/ which are privacy instructions
          if grep -rnI '/home/' genome/ organs/ docs/ README.md 2>/dev/null | grep -v '<user>' | grep -v '<username>'; then
            echo "ERROR: Hardcoded paths found"
            exit 1
          fi
          echo "No hardcoded paths found"

      - name: Dry-run install (all platforms)
        run: |
          for platform in gemini kiro copilot claude mcp; do
            echo "=== $platform ==="
            python3 -m soma_cli.cli install --platform "$platform" --dry-run || exit 1
          done

      - name: Dry-run uninstall
        run: python3 -m soma_cli.cli uninstall --platform gemini --dry-run

  # B3: the full pytest suite on Windows. Failures fail the job; there is no
  # continue-on-error. Steps run under Git Bash (as on a contributor's machine);
  # tests that drive PowerShell spawn it themselves.
  test-windows:
    needs: build-wheel
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and a current release; mirrors the Linux matrix policy.
        python-version: ['3.9', '3.12']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soma-wheel
          path: dist/

      - name: Verify artifact digests
        run: python .github/scripts/verify_dist.py verify dist

      - name: Install test dependencies
        run: |
          pip install pytest==8.3.4 pytest-xdist==3.6.1 ruff==0.9.10 hypothesis==6.126.0 coverage==7.6.12 pyyaml==6.0.2 anyio==4.12.1
          pip install dist/*.whl

      - name: Wheel smoke test (source-isolated)
        run: |
          cd "$RUNNER_TEMP"
          python -c "import soma_cli, soma_sdk; print('Soma wheel imports cleanly')"

      - name: Run Layer 1 Deterministic Verification
        run: python -m soma_cli.verify --layer1-only

      # HOME and USERPROFILE point at a throwaway directory so no test can write
      # to the runner's real profile (BUG-010). PYTHONUTF8=0 pins the Windows
      # legacy encodings (cp1252 locale and piped stdio), the ones contributors
      # hit (BUG-012, BUG-038), even if a future Python defaults to UTF-8 mode.
      - name: Run test suite
        env:
          HOME: ${{ runner.temp }}\soma-home
          USERPROFILE: ${{ runner.temp }}\soma-home
          PYTHONUTF8: '0'
        run: |
          python -c "import os; os.makedirs(os.environ['USERPROFILE'], exist_ok=True)"
          python -m pytest tests/

  validate-windows:
    needs: [build-wheel, dependency-audit]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dry-run Python install and uninstall on Windows
        run: |
          python -m soma_cli.cli install --platform gemini --dry-run
          python -m soma_cli.cli uninstall --platform gemini --dry-run
