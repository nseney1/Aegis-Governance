version: 2
updates:
  # Bumps SHA-pinned actions and keeps the trailing `# vX.Y.Z` comments in sync.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
